name: Release

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Serialize releases so two pushes can't compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed components
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/backend-build.yaml"
            frontend:
              - "frontend/**"
              - ".github/workflows/frontend-build.yaml"

      # Bump is derived from Conventional Commits: feat -> minor, BREAKING CHANGE -> major, else patch.
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          release_branches: main

  backend:
    needs: version
    if: needs.version.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/backend-build.yaml
    with:
      version: ${{ needs.version.outputs.tag }}

