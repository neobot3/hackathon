name: Frontend image

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yaml"
  workflow_call:
    inputs:
      version:
        description: Semantic version tag (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/techrep-scheduler-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ inputs.version != '' }}
          # Vite bakes these into the bundle; set them as repository variables (not secrets). Empty values fall back to defaults in src/config.js.
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_AUTH_MODE=${{ vars.VITE_AUTH_MODE }}
            VITE_AZURE_CLIENT_ID=${{ vars.VITE_AZURE_CLIENT_ID }}
            VITE_AZURE_TENANT_ID=${{ vars.VITE_AZURE_TENANT_ID }}
            VITE_AZURE_AUTHORITY=${{ vars.VITE_AZURE_AUTHORITY }}
            VITE_AZURE_REDIRECT_URI=${{ vars.VITE_AZURE_REDIRECT_URI }}
            VITE_AZURE_POST_LOGOUT_REDIRECT_URI=${{ vars.VITE_AZURE_POST_LOGOUT_REDIRECT_URI }}
            VITE_AZURE_API_SCOPE=${{ vars.VITE_AZURE_API_SCOPE }}
            VITE_AZURE_ADMIN_ROLE=${{ vars.VITE_AZURE_ADMIN_ROLE }}
            VITE_AZURE_SCHEDULER_ROLE=${{ vars.VITE_AZURE_SCHEDULER_ROLE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend