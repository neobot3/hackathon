# Template only - do not commit real values. Prefer generating from backend/.env:
#   kubectl create secret generic techrep-backend-env -n hackathon --from-env-file=backend/.env --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: techrep-backend-env
  namespace: hackathon
  labels:
    app.kubernetes.io/name: techrep-backend
    app.kubernetes.io/part-of: techrep-scheduler
type: Opaque
stringData:
  DB_DRIVER: postgresql+psycopg2
  # Must be reachable from the cluster, not localhost.
  DB_HOST: <db-host>
  DB_PORT: "5432"
  DB_NAME: techrep
  DB_USER: techrep
  DB_PASSWORD: <db-password>
  DB_ECHO: "false"
  SOLVER_MAX_SECONDS: "10"
