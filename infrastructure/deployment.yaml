apiVersion: apps/v1
kind: Deployment
metadata:
  name: techrep-backend
  namespace: hackathon
  labels:
    app.kubernetes.io/name: techrep-backend
    app.kubernetes.io/part-of: techrep-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: techrep-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: techrep-backend
        app.kubernetes.io/part-of: techrep-scheduler
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Set to the release tag produced by the pipeline.
          image: ghcr.io/neobot3/techrep-scheduler-backend:v0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: techrep-backend-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techrep-frontend
  namespace: hackathon
  labels:
    app.kubernetes.io/name: techrep-frontend
    app.kubernetes.io/part-of: techrep-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: techrep-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: techrep-frontend
        app.kubernetes.io/part-of: techrep-scheduler
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Set to the release tag produced by the pipeline.
          image: ghcr.io/neobot3/techrep-scheduler-frontend:v0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
