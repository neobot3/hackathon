apiVersion: v1
kind: Service
metadata:
  name: techrep-backend
  namespace: hackathon
  labels:
    app.kubernetes.io/name: techrep-backend
    app.kubernetes.io/part-of: techrep-scheduler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: techrep-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: techrep-frontend
  namespace: hackathon
  labels:
    app.kubernetes.io/name: techrep-frontend
    app.kubernetes.io/part-of: techrep-scheduler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: techrep-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
