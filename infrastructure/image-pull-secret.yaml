# Template only - do not commit real values. Prefer creating it directly with a PAT that has read:packages:
#   kubectl create secret docker-registry ghcr-pull-secret -n hackathon --docker-server=ghcr.io \
#     --docker-username=<github-user> --docker-password=<pat> --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: hackathon
  labels:
    app.kubernetes.io/part-of: techrep-scheduler
type: kubernetes.io/dockerconfigjson
stringData:
  # auth is base64 of "<github-user>:<pat>"
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "auth": "<base64-github-user:pat>"
        }
      }
    }
